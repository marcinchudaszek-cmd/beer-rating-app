    <meta name="description" content="Aplikacja do oceniania piwa, przeglądania składników, historii i ciekawostek o piwach." />
    <script>
      // Motyw przed startem Reacta — useTheme ustawia .dark dopiero w useEffect,
      // po pierwszym malowaniu, co dawało biały błysk w ciemnym motywie.
      // Ta sama logika co w src/hooks/useTheme.ts.
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* localStorage zablokowany — zostaje jasny motyw */ }
    </script>
